<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>划词搜索</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>划词搜索</h1>
      <p class="status">正在读取额度…</p>
      <label>
        激活码
        <input id="code" type="text" placeholder="GASE-UNLOCK-2026" />
      </label>
      <p class="error" id="error"></p>
      <button id="unlock" type="button">解锁高级额度</button>
      <p class="hint">选中任意网页文字，点击蓝色「划词搜索」按钮即可打开可拖拽悬浮窗。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
